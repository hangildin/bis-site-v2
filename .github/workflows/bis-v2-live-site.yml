name: BIS old V2 preview redirect verification
on:
  workflow_run:
    workflows: ["BIS V2 commercial site deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify former V2 site redirects and is not indexed
        run: python3 scripts/check_preview_redirect.py --live
